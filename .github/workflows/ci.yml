name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge templates
        env:
          HF_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: python merge.py --froggeric-rev main --turbo-brilliance-repo --turbo-brilliance-rev main

      - name: Run checks
        run: python check.py
